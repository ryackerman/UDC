// ============ TOOL IMPLEMENTATIONS ============
const ops = {
  'base64-encode': (s) => { try { return btoa(unescape(encodeURIComponent(s))); } catch { return 'Invalid input'; } },
  'base64-decode': (s) => { try { return decodeURIComponent(escape(atob(s))); } catch { return 'Invalid Base64'; } },
  'url-encode': (s) => encodeURIComponent(s),
  'url-decode': (s) => { try { return decodeURIComponent(s); } catch { return 'Invalid URL encoding'; } },
  'html-encode': (s) => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])),
  'html-decode': (s) => s.replace(/&(amp|lt|gt|quot|#39);/g, m => ({ '&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'" }[m])),
  'hex-convert': (s) => s.split('').map(c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(' '),
  'binary-convert': (s) => s.split('').map(c => c.charCodeAt(0).toString(2).padStart(8,'0')).join(' '),
  'rot13': (s) => s.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26)),
  'url-encode-full': (s) => encodeURIComponent(s),
};

// ============ LOGIN ============
// Sessions are issued by admin: each session has a display name, a unique access code, and a set of permitted tool IDs.
const DEFAULT_USERS = [
  { name: 'Administrator', accessCode: 'UDC-ADMIN-2026', license: 'admin', tools: '*' },
];

function Login({ onLogin, userStore }) {
  const [name, setName] = useState('');
  const [code, setCode] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const submit = () => {
    setError('');
    setLoading(true);
    setTimeout(() => {
      const user = userStore.find(u =>
        u.name.toLowerCase().trim() === name.toLowerCase().trim() &&
        u.accessCode === code.trim()
      );
      if (!user) {
        setError('Invalid session credentials');
        setLoading(false);
        return;
      }
      onLogin({
        name: user.name,
        accessCode: user.accessCode,
        role: user.license,
        license: user.license,
        tools: user.tools,
        avatar: user.name.charAt(0).toUpperCase(),
      });
    }, 500);
  };

  return (
    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
      <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(139,92,246,0.15),_transparent_50%)]"></div>
      <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_bottom,_rgba(6,182,212,0.1),_transparent_50%)]"></div>
      <div className="relative w-full max-w-md">
        <div className="flex justify-center mb-8">
          <Logo size={56} full />
        </div>
        <div className="bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-8 shadow-2xl">
          <h1 className="text-2xl font-bold text-white mb-1">Session sign-in</h1>
          <p className="text-sm text-slate-400 mb-6">Enter your session name and access code</p>

          <div className="space-y-4">
            <div>
              <label className="text-xs text-slate-400 mb-1 block">Session Name</label>
              <input value={name} onChange={e => setName(e.target.value)} autoFocus
                onKeyDown={e => e.key === 'Enter' && submit()}
                placeholder="e.g. Administrator"
                className="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label className="text-xs text-slate-400 mb-1 block">Access Code</label>
              <input value={code} onChange={e => setCode(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && submit()}
                placeholder="UDC-XXXX-XXXX"
                className="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono focus:border-indigo-500 focus:outline-none" />
            </div>

            {error && (
              <div className="bg-rose-950/50 border border-rose-800/50 rounded-lg px-3 py-2 text-xs text-rose-300 flex items-center gap-2">
                <AlertCircle size={12} /> {error}
              </div>
            )}

            <button onClick={submit} disabled={loading || !name || !code}
              className="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center gap-2">
              {loading ? <RefreshCw size={16} className="animate-spin" /> : <><Shield size={16} /> Open Session</>}
            </button>
          </div>

          <div className="mt-6 pt-6 border-t border-slate-800 text-center">
            <p className="text-[11px] text-slate-500">Sessions and tool permissions are issued by your administrator.</p>
          </div>
        </div>
        <p className="text-center text-xs text-slate-600 mt-6">UDC Enterprise Suite v2.0 • Made by Klyd © 2026</p>
      </div>
    </div>
  );
}

// ============ TOOL PANEL ============
function ToolPanel({ tool, onClose, onActivity }) {
  const [input, setInput] = useState('');
  const [output, setOutput] = useState('');
  const [extra, setExtra] = useState(null);

  const run = (val = input) => {
    if (!val) return setOutput('');
    let result = '';
    if (ops[tool.id]) {
      result = ops[tool.id](val);
    } else if (tool.id === 'json-format') {
      try { result = JSON.stringify(JSON.parse(val), null, 2); } catch (e) { result = 'Invalid JSON: ' + e.message; }
    } else if (tool.id === 'jwt-decode') {
      try {
        const [h, p, s] = val.split('.');
        const dec = (x) => JSON.stringify(JSON.parse(atob(x.replace(/-/g,'+').replace(/_/g,'/'))), null, 2);
        result = `HEADER:\n${dec(h)}\n\nPAYLOAD:\n${dec(p)}\n\nSIGNATURE:\n${s}`;
      } catch { result = 'Invalid JWT'; }
    } else if (tool.id === 'uuid-gen') {
      result = Array.from({ length: 5 }, () =>
        'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        })
      ).join('\n');
    } else if (tool.id === 'hash-gen') {
      // simple non-crypto hashes for demo
      let h1 = 0; for (let i = 0; i < val.length; i++) h1 = (h1 << 5) - h1 + val.charCodeAt(i) | 0;
      result = `MD5:    ${Math.abs(h1).toString(16).padStart(32,'a')}\nSHA1:   ${Math.abs(h1*7).toString(16).padStart(40,'b')}\nSHA256: ${Math.abs(h1*13).toString(16).padStart(64,'c')}\nSHA512: ${Math.abs(h1*19).toString(16).padStart(128,'d')}`;
    } else if (tool.id === 'ioc-extract') {
      const urls = val.match(/https?:\/\/[^\s]+/g) || [];
      const emails = val.match(/[\w.-]+@[\w.-]+\.\w+/g) || [];
      const ipv4 = val.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g) || [];
      const domains = val.match(/\b[a-z0-9-]+\.[a-z]{2,}\b/gi) || [];
      result = `URLs (${urls.length}):\n${urls.join('\n')}\n\nEmails (${emails.length}):\n${emails.join('\n')}\n\nIPv4 (${ipv4.length}):\n${ipv4.join('\n')}\n\nDomains (${domains.length}):\n${domains.join('\n')}`;
    } else if (tool.id === 'entropy') {
      const freq = {};
      for (const c of val) freq[c] = (freq[c] || 0) + 1;
      const len = val.length;
      let h = 0;
      for (const k in freq) { const p = freq[k]/len; h -= p * Math.log2(p); }
      result = `Shannon Entropy: ${h.toFixed(4)} bits/char\nLength: ${len}\nUnique chars: ${Object.keys(freq).length}\n\nDistribution (top 10):\n${Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([c,n])=>`  ${JSON.stringify(c)}: ${n} (${(n/len*100).toFixed(1)}%)`).join('\n')}`;
    } else if (tool.id === 'secret-detect') {
      const patterns = [
        { name: 'AWS Access Key', re: /AKIA[0-9A-Z]{16}/g },
        { name: 'GitHub Token', re: /gh[ps]_[A-Za-z0-9]{36}/g },
        { name: 'Generic API Key', re: /api[_-]?key["'\s:=]+[A-Za-z0-9]{20,}/gi },
        { name: 'JWT Token', re: /eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g },
        { name: 'Base64 Blob (>40)', re: /[A-Za-z0-9+/]{40,}={0,2}/g },
      ];
      const found = patterns.map(p => ({ ...p, matches: val.match(p.re) || [] })).filter(p => p.matches.length);
      result = found.length ? found.map(f => `⚠ ${f.name} (${f.matches.length}):\n${f.matches.slice(0,3).join('\n')}`).join('\n\n') : '✓ No secrets detected';
    } else if (tool.id === 'smart-detect') {
      const checks = [
        { name: 'Base64', test: /^[A-Za-z0-9+/]+=*$/.test(val.trim()) && val.length % 4 === 0, conf: 95 },
        { name: 'JWT', test: /^eyJ[\w-]+\.eyJ[\w-]+\.[\w-]+$/.test(val.trim()), conf: 99 },
        { name: 'JSON', test: (() => { try { JSON.parse(val); return true; } catch { return false; } })(), conf: 100 },
        { name: 'URL Encoded', test: /%[0-9A-F]{2}/i.test(val), conf: 85 },
        { name: 'Hex', test: /^[0-9A-Fa-f\s]+$/.test(val.trim()) && val.replace(/\s/g,'').length % 2 === 0, conf: 80 },
        { name: 'HTML', test: /<[a-z][\s\S]*>/i.test(val), conf: 90 },
        { name: 'XML', test: /<\?xml/.test(val), conf: 99 },
      ];
      const hits = checks.filter(c => c.test);
      result = hits.length ? hits.map(h => `${h.name.padEnd(15)} ${h.conf}% confidence`).join('\n') : 'No format detected';
    } else if (tool.id === 'regex-test') {
      try {
        const [pattern, ...rest] = val.split('\n');
        const text = rest.join('\n');
        const m = pattern.match(/^\/(.+)\/([gimsu]*)$/);
        const re = m ? new RegExp(m[1], m[2]) : new RegExp(pattern, 'g');
        const matches = [...text.matchAll(re)];
        result = `Pattern: ${re}\nMatches: ${matches.length}\n\n${matches.map((m,i)=>`[${i}] "${m[0]}" at ${m.index}`).join('\n')}`;
      } catch (e) { result = 'Error: ' + e.message; }
    } else if (tool.id === 'mime-parser') {
      const lines = val.split('\n');
      const headers = {};
      let i = 0;
      while (i < lines.length && lines[i].trim()) {
        const m = lines[i].match(/^([\w-]+):\s*(.+)/);
        if (m) headers[m[1]] = m[2];
        i++;
      }
      result = `── MIME TREE ──\nHeaders detected: ${Object.keys(headers).length}\n${Object.entries(headers).map(([k,v])=>`  ${k}: ${v.slice(0,80)}`).join('\n')}\n\nContent boundary: ${(val.match(/boundary="?([^";\n]+)"?/)||[])[1] || 'none'}\nAttachments: ${(val.match(/Content-Disposition:\s*attachment/g)||[]).length}\nInline parts: ${(val.match(/Content-Disposition:\s*inline/g)||[]).length}`;
    } else if (tool.id === 'header-analyzer') {
      const get = (h) => (val.match(new RegExp(`^${h}:\\s*(.+)`, 'mi')) || [])[1] || 'not found';
      result = `── EMAIL FORENSICS ──\nFrom:    ${get('From')}\nTo:      ${get('To')}\nSubject: ${get('Subject')}\n\nAuthentication:\n  SPF:   ${val.includes('spf=pass') ? '✓ PASS' : val.includes('spf=') ? '✗ FAIL' : '? not found'}\n  DKIM:  ${val.includes('dkim=pass') ? '✓ PASS' : val.includes('dkim=') ? '✗ FAIL' : '? not found'}\n  DMARC: ${val.includes('dmarc=pass') ? '✓ PASS' : val.includes('dmarc=') ? '✗ FAIL' : '? not found'}\n\nReceived hops: ${(val.match(/^Received:/gmi)||[]).length}`;
    } else if (tool.id === 'hex-viewer') {
      const lines = [];
      for (let i = 0; i < Math.min(val.length, 512); i += 16) {
        const chunk = val.slice(i, i + 16);
        const hex = chunk.split('').map(c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(' ').padEnd(48);
        const ascii = chunk.split('').map(c => /[\x20-\x7e]/.test(c) ? c : '.').join('');
        lines.push(`${i.toString(16).padStart(8,'0')}  ${hex}  |${ascii}|`);
      }
      result = lines.join('\n') + (val.length > 512 ? `\n\n... ${val.length - 512} more bytes` : '');
    } else if (tool.id === 'html-analyzer') {
      const tags = (val.match(/<(\w+)/g) || []).map(t => t.slice(1));
      const links = (val.match(/href="([^"]+)"/g) || []).length;
      const imgs = (val.match(/<img/g) || []).length;
      const scripts = (val.match(/<script/g) || []).length;
      const meta = (val.match(/<meta[^>]+>/g) || []).length;
      result = `── HTML ANALYSIS ──\nTotal tags: ${tags.length}\nLinks: ${links}\nImages: ${imgs}\nScripts: ${scripts}\nMeta tags: ${meta}\n\nTag frequency:\n${Object.entries(tags.reduce((a,t)=>(a[t]=(a[t]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,n])=>`  <${t}>: ${n}`).join('\n')}`;
    } else if (tool.id === 'html-to-text') {
      result = val.replace(/<style[\s\S]*?<\/style>/gi, '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    } else if (tool.id === 'text-to-html') {
      result = '<p>' + val.split('\n\n').map(p => p.replace(/\n/g, '<br>')).join('</p>\n<p>') + '</p>';
    } else if (tool.id === 'deliverability') {
      const triggers = ['free', 'winner', 'click here', 'urgent', '!!!', 'guarantee', 'limited time', '100%'];
      const found = triggers.filter(t => val.toLowerCase().includes(t));
      const score = Math.max(0, 100 - found.length * 12);
      result = `── DELIVERABILITY SCORE: ${score}/100 ──\n${score > 80 ? '✓ Good' : score > 50 ? '⚠ Caution' : '✗ Likely spam'}\n\nSpam triggers found (${found.length}):\n${found.map(f=>`  • ${f}`).join('\n') || '  (none)'}\n\nWord count: ${val.split(/\s+/).length}\nCAPS ratio: ${((val.match(/[A-Z]/g)||[]).length/val.length*100).toFixed(1)}%\nExclamations: ${(val.match(/!/g)||[]).length}`;
    } else {
      result = `[${tool.name}] processed ${val.length} chars\n\nThis tool is implemented in the full UDC build. Output preview:\n\n${val.slice(0, 200)}${val.length > 200 ? '...' : ''}`;
    }
    setOutput(result);
    onActivity(tool);
  };

  const copy = () => { navigator.clipboard?.writeText(output); };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-900/50">
        <div className="flex items-center gap-2">
          <tool.icon size={16} className="text-indigo-400" />
          <span className="font-medium text-sm text-white">{tool.name}</span>
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 uppercase">{tool.cat}</span>
        </div>
        <div className="flex gap-1">
          <button onClick={() => run()} className="text-xs px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded flex items-center gap-1"><Play size={11} /> Run</button>
          <button onClick={() => { setInput(''); setOutput(''); }} className="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded flex items-center gap-1"><Trash2 size={11} /> Clear</button>
          <button onClick={() => { setInput(output); setOutput(input); }} className="text-xs px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded flex items-center gap-1"><ArrowRightLeft size={11} /> Swap</button>
        </div>
      </div>

      <div className="flex-1 grid grid-cols-2 gap-px bg-slate-800 overflow-hidden">
        <div className="bg-slate-950 flex flex-col">
          <div className="px-3 py-1.5 text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-800 flex justify-between items-center">
            <span>Input</span>
            <span>{input.length} chars</span>
          </div>
          <textarea value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.ctrlKey && e.key === 'Enter') run(); }}
            placeholder={`Paste content here... (Ctrl+Enter to run)`}
            className="flex-1 bg-slate-950 text-slate-100 text-xs font-mono p-3 resize-none focus:outline-none" />
        </div>
        <div className="bg-slate-950 flex flex-col">
          <div className="px-3 py-1.5 text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-800 flex justify-between items-center">
            <span>Output</span>
            <div className="flex gap-2">
              <button onClick={copy} className="hover:text-white flex items-center gap-1"><Copy size={10} /> Copy</button>
              <span>{output.length} chars</span>
            </div>
          </div>
          <pre className="flex-1 bg-slate-950 text-emerald-300 text-xs font-mono p-3 overflow-auto whitespace-pre-wrap">{output || <span className="text-slate-600">Output will appear here...</span>}</pre>
        </div>
      </div>
    </div>
  );
}

// ============ MAIN APP ============
function UDCApp() {
  const [state, setState] = useState(() => {
    try {
      const saved = localStorage.getItem('udc_session');
      if (saved) {
        const user = JSON.parse(saved);
        return { ...initialState, user, license: user.license };
      }
    } catch {}
    return initialState;
  });
  const [userStore, setUserStore] = useState(() => {
    try {
      const saved = localStorage.getItem('udc_user_store');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch {}
    return DEFAULT_USERS;
  });

  useEffect(() => {
    try { localStorage.setItem('udc_user_store', JSON.stringify(userStore)); } catch {}
  }, [userStore]);
  const [page, setPage] = useState('dashboard');
  const [sidebarCat, setSidebarCat] = useState({});
  const [toast, setToast] = useState(null);
  const [sidebarSearch, setSidebarSearch] = useState('');

  useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); setState(s => ({ ...s, showPalette: true })); }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'D') { e.preventDefault(); setState(s => ({ ...s, showDevConsole: !s.showDevConsole })); }
      if (e.key === 'Escape') setState(s => ({ ...s, showPalette: false }));
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const login = (user) => {
    try { localStorage.setItem('udc_session', JSON.stringify(user)); } catch {}
    setState(s => ({ ...s, user, license: user.license }));
    showToast(`Welcome, ${user.name}`);
  };

  const logout = () => {
    try { localStorage.removeItem('udc_session'); } catch {}
    setState(initialState);
  };

  const hasToolAccess = (toolId) => {
    if (!state.user) return false;
    if (state.user.tools === '*') return true;
    return Array.isArray(state.user.tools) && state.user.tools.includes(toolId);
  };

  const openTool = (tool) => {
    if (!hasToolAccess(tool.id)) {
      showToast(`Access denied · ${tool.name} not assigned to your session`);
      return;
    }
    setState(s => {
      const exists = s.tabs.find(t => t.id === tool.id);
      const tabs = exists ? s.tabs : [...s.tabs, tool];
      const recent = [tool.id, ...s.recent.filter(id => id !== tool.id)].slice(0, 8);
      return { ...s, tabs, activeTab: tool.id, recent };
    });
    setPage('workspace');
  };

  const closeTab = (id) => setState(s => {
    const tabs = s.tabs.filter(t => t.id !== id);
    return { ...s, tabs, activeTab: tabs.length ? tabs[tabs.length - 1].id : null };
  });

  const toggleFav = (id) => setState(s => ({
    ...s,
    favorites: s.favorites.includes(id) ? s.favorites.filter(f => f !== id) : [...s.favorites, id]
  }));

  const recordActivity = (tool) => {
    setState(s => ({
      ...s,
      history: [...s.history, { tool: tool.name, time: new Date().toLocaleTimeString() }].slice(-20),
      stats: { ...s.stats, ops: s.stats.ops + 1, enc: tool.id.includes('encode') ? s.stats.enc+1 : s.stats.enc, dec: tool.id.includes('decode') ? s.stats.dec+1 : s.stats.dec, ocr: tool.id === 'ocr' ? s.stats.ocr+1 : s.stats.ocr, mime: tool.id.includes('mime') ? s.stats.mime+1 : s.stats.mime }
    }));
  };

  if (!state.user) return <Login onLogin={login} userStore={userStore} />;

  const filteredTools = sidebarSearch
    ? TOOLS.filter(t => t.name.toLowerCase().includes(sidebarSearch.toLowerCase()))
    : null;

  const activeTabTool = state.tabs.find(t => t.id === state.activeTab);

  const roleBadge = {
    guest: { bg: 'bg-slate-700', text: 'GUEST' },
    premium: { bg: 'bg-gradient-to-r from-indigo-600 to-violet-600', text: 'PREMIUM' },
    enterprise: { bg: 'bg-gradient-to-r from-amber-600 to-orange-600', text: 'ENTERPRISE' },
    admin: { bg: 'bg-gradient-to-r from-rose-600 to-red-600', text: 'ADMIN' },
  }[state.user.license] || { bg: 'bg-slate-700', text: 'USER' };

  return (
    <div className={`udc-root ${state.theme === 'light' ? 'light' : 'dark'} h-screen text-slate-100 flex flex-col font-sans`} style={{ fontFamily: 'ui-sans-serif, system-ui, -apple-system, sans-serif', backgroundColor: state.theme === 'light' ? '#f8fafc' : '#020617' }}>
      <style>{`

                            <span className="truncate flex-1 text-left">{t.name}</span>
                            {locked && <Lock size={9} className="text-amber-500" />}
                            {state.favorites.includes(t.id) && <Star size={9} className="text-amber-400 fill-amber-400" />}
                          </button>
                        );
                      })}
                    </div>
                  );
                })}

                {state.user.license === 'admin' && (
                  <>
                    <div className="mt-3 mb-1 px-2 text-[10px] uppercase tracking-wider text-rose-500">Admin</div>
                    <SidebarItem icon={ShieldCheck} label="Admin Dashboard" active={page === 'admin'} onClick={() => setPage('admin')} />
                    <SidebarItem icon={Users} label="User Management" active={page === 'users'} onClick={() => setPage('users')} />
                    <SidebarItem icon={Key} label="License Manager" active={page === 'licenses'} onClick={() => setPage('licenses')} />
                    <SidebarItem icon={ScrollText} label="System Logs" active={page === 'logs'} onClick={() => setPage('logs')} />
                  </>
                )}

                <div className="mt-3 mb-1 px-2 text-[10px] uppercase tracking-wider text-slate-500">Account</div>
                <SidebarItem icon={Settings} label="Settings" active={page === 'settings'} onClick={() => setPage('settings')} />
                <SidebarItem icon={User} label="Profile" active={page === 'profile'} onClick={() => setPage('profile')} />
              </>
            )}
            {sidebarSearch && filteredTools.map(t => (
              <button key={t.id} onClick={() => openTool(t)}
                className="w-full flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-slate-800 text-slate-300">
                <t.icon size={12} className="text-indigo-400" />
                <span className="truncate flex-1 text-left">{t.name}</span>
                <span className="text-[9px] text-slate-500">{t.cat}</span>
              </button>
            ))}
          </div>

          <div className="p-2 border-t border-slate-800">
            <div className="bg-gradient-to-br from-indigo-900/50 to-purple-900/50 border border-indigo-800/50 rounded-lg p-2.5">
              <div className="flex items-center gap-1.5 text-[10px] font-semibold text-indigo-300 mb-1">
                <Sparkles size={10} /> {state.user.license.toUpperCase()} SESSION
              </div>
              <div className="text-[10px] text-slate-400 mb-1.5">
                {state.user.tools === '*' ? `${TOOLS.length}/${TOOLS.length}` : `${(state.user.tools||[]).length}/${TOOLS.length}`} tools assigned
              </div>
              <div className="text-[9px] text-slate-500 font-mono truncate">{state.user.accessCode}</div>
            </div>
          </div>
        </div>

        {/* MAIN CONTENT */}
        <div className="flex-1 flex flex-col overflow-hidden">
          {page === 'workspace' && state.tabs.length > 0 && (
            <div className="flex bg-slate-900 border-b border-slate-800 overflow-x-auto">
              {state.tabs.map(t => (
                <div key={t.id}
                  className={`flex items-center gap-2 px-3 py-2 border-r border-slate-800 cursor-pointer min-w-0 ${state.activeTab === t.id ? 'bg-slate-950 text-white' : 'text-slate-400 hover:bg-slate-800/50'}`}
                  onClick={() => setState(s => ({ ...s, activeTab: t.id }))}>
                  <t.icon size={12} />
                  <span className="text-xs truncate">{t.name}</span>
                  <button onClick={e => { e.stopPropagation(); closeTab(t.id); }} className="hover:bg-slate-700 rounded p-0.5">
                    <X size={10} />
                  </button>
                </div>
              ))}
            </div>
          )}

          <div className="flex-1 overflow-hidden">
            {page === 'dashboard' && <Dashboard state={state} openTool={openTool} />}
            {page === 'workspace' && (activeTabTool ? <ToolPanel tool={activeTabTool} onClose={() => closeTab(activeTabTool.id)} onActivity={recordActivity} /> :
              <EmptyWorkspace openTool={openTool} />)}
            {page === 'favorites' && <FavoritesPage state={state} openTool={openTool} toggleFav={toggleFav} />}
            {page === 'history' && <HistoryPage state={state} />}
            {page === 'settings' && <SettingsPage state={state} setState={setState} />}
            {page === 'profile' && <ProfilePage state={state} />}
            {page === 'admin' && <AdminPage state={state} />}
            {page === 'users' && <UsersPage userStore={userStore} setUserStore={setUserStore} showToast={showToast} currentUser={state.user} />}
            {page === 'licenses' && <LicensesPage />}
            {page === 'logs' && <LogsPage state={state} />}
          </div>

          <Footer />
        </div>
      </div>

      {state.showPalette && <Palette onClose={() => setState(s => ({ ...s, showPalette: false }))} openTool={openTool} navigate={setPage} />}
      {state.showDevConsole && state.user.license === 'admin' && <DevConsole state={state} onClose={() => setState(s => ({ ...s, showDevConsole: false }))} />}
      {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

const UsersPage = ({ userStore, setUserStore, showToast, currentUser }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', accessCode: '', license: 'guest', tools: [], allTools: false });

  const openAdd = () => {
    setEditing(null);
    setForm({ name: '', accessCode: '', license: 'guest', tools: [], allTools: false });
    setShowAdd(true);
  };
  const openEdit = (u) => {
    setEditing(u.name);
    setForm({
      name: u.name,
      accessCode: u.accessCode,
      license: u.license,
      tools: u.tools === '*' ? [] : (u.tools || []),
      allTools: u.tools === '*',
    });
    setShowAdd(true);
  };
  const save = () => {
    if (!form.name.trim() || !form.accessCode.trim()) { showToast('Name & access code required'); return; }
    const entry = {
      name: form.name.trim(),
      accessCode: form.accessCode.trim(),
      license: form.license,
      tools: form.allTools ? '*' : form.tools,
    };
    if (editing) {
      setUserStore(s => s.map(u => u.name === editing ? entry : u));
      showToast(`Updated ${entry.name}`);
    } else {
      if (userStore.find(u => u.name.toLowerCase() === entry.name.toLowerCase())) { showToast('Name already exists'); return; }
      if (userStore.find(u => u.accessCode === entry.accessCode)) { showToast('Access code already in use'); return; }
      setUserStore(s => [...s, entry]);
      showToast(`Created session for ${entry.name}`);
    }
    setShowAdd(false);
  };
  const remove = (name) => {
    if (name === currentUser.name) { showToast('Cannot delete active session'); return; }
    setUserStore(s => s.filter(u => u.name !== name));
    showToast(`Removed ${name}`);
  };
  const genCode = () => {
    const seg = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
    setForm(f => ({ ...f, accessCode: `UDC-${seg()}-${seg()}-2026` }));
  };
  const toggleTool = (id) => setForm(f => ({ ...f, tools: f.tools.includes(id) ? f.tools.filter(t => t !== id) : [...f.tools, id] }));
  const toggleCategory = (cat) => {
    const catTools = TOOLS.filter(t => t.cat === cat).map(t => t.id);
    const allSelected = catTools.every(id => form.tools.includes(id));
    setForm(f => ({ ...f, tools: allSelected ? f.tools.filter(t => !catTools.includes(t)) : [...new Set([...f.tools, ...catTools])] }));
  };

  return (
    <div className="p-6 overflow-auto h-full">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h1 className="text-2xl font-bold text-white">Session Management</h1>
          <p className="text-xs text-slate-400 mt-1">Issue session credentials and assign tools · {userStore.length} sessions</p>
        </div>
        <button onClick={openAdd} className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded flex items-center gap-1"><Plus size={12} /> New Session</button>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-slate-800/50 text-xs uppercase text-slate-400">
            <tr>
              <th className="text-left p-3">Session Owner</th>
              <th className="text-left p-3">Access Code</th>
              <th className="text-left p-3">License</th>
              <th className="text-left p-3">Tools</th>
              <th className="text-left p-3">Status</th>
              <th className="text-right p-3">Actions</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-800">
            {userStore.map((u) => {
              const isCurrent = u.name === currentUser.name;
              const badge = { guest:'bg-slate-700', premium:'bg-indigo-600', enterprise:'bg-amber-600', admin:'bg-rose-600' }[u.license] || 'bg-slate-700';
              const toolCount = u.tools === '*' ? TOOLS.length : (u.tools || []).length;
              return (
                <tr key={u.name} className="hover:bg-slate-800/30">
                  <td className="p-3">
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-500 to-cyan-500 flex items-center justify-center text-[10px] font-bold text-white">{u.name.charAt(0).toUpperCase()}</div>
                      <span className="text-slate-200 text-sm">{u.name}</span>
                    </div>
                  </td>
                  <td className="p-3 text-xs text-slate-400 font-mono">{u.accessCode}</td>
                  <td className="p-3"><span className={`text-[10px] uppercase font-semibold ${badge} px-2 py-0.5 rounded text-white`}>{u.license}</span></td>
                  <td className="p-3 text-xs">
                    {u.tools === '*'
                      ? <span className="text-emerald-400">All ({TOOLS.length})</span>
                      : <span className="text-slate-300">{toolCount} <span className="text-slate-600">of {TOOLS.length}</span></span>}
                  </td>
                  <td className="p-3">
                    {isCurrent
                      ? <span className="text-xs text-emerald-400">● active</span>
                      : <span className="text-xs text-slate-500">● idle</span>}
                  </td>
                  <td className="p-3 text-right">
                    <button onClick={() => openEdit(u)} className="text-xs text-slate-400 hover:text-white px-2 py-1">Edit</button>
                    <button onClick={() => remove(u.name)} disabled={isCurrent}
                      className="text-xs text-rose-400 hover:text-rose-300 disabled:text-slate-700 disabled:cursor-not-allowed px-2 py-1">Delete</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {showAdd && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowAdd(false)}>
          <div className="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
              <h2 className="font-semibold text-white text-sm">{editing ? 'Edit Session' : 'Create Session'}</h2>
              <button onClick={() => setShowAdd(false)} className="text-slate-400 hover:text-white"><X size={16} /></button>
            </div>
            <div className="p-5 space-y-4 overflow-auto">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 mb-1 block">Session Owner Name *</label>
                  <input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} disabled={!!editing}
                    placeholder="e.g. Alice Cooper"
                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white disabled:opacity-60 focus:border-indigo-500 focus:outline-none" />
                </div>
                <div>
                  <label className="text-xs text-slate-400 mb-1 block">License Tier</label>
                  <select value={form.license} onChange={e => setForm(f => ({ ...f, license: e.target.value }))}
                    className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:border-indigo-500 focus:outline-none">
                    <option value="guest">Guest</option>
                    <option value="premium">Premium</option>
                    <option value="enterprise">Enterprise</option>
                    <option value="admin">Administrator</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="text-xs text-slate-400 mb-1 block flex justify-between">
                  <span>Access Code *</span>
                  <button onClick={genCode} className="text-indigo-400 hover:text-indigo-300">Generate</button>
                </label>
                <input value={form.accessCode} onChange={e => setForm(f => ({ ...f, accessCode: e.target.value }))}
                  placeholder="UDC-XXXX-XXXX-2026"
                  className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white font-mono focus:border-indigo-500 focus:outline-none" />
              </div>

              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs text-slate-400">Assigned Tools</label>
                  <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                    <input type="checkbox" checked={form.allTools} onChange={e => setForm(f => ({ ...f, allTools: e.target.checked }))} />
                    Grant access to all tools
                  </label>
                </div>
                {!form.allTools && (
                  <div className="bg-slate-950 border border-slate-800 rounded-lg p-2 max-h-64 overflow-auto">
                    {CATEGORIES.filter(c => TOOLS.some(t => t.cat === c)).map(cat => {
                      const catTools = TOOLS.filter(t => t.cat === cat);
                      const selected = catTools.filter(t => form.tools.includes(t.id)).length;
                      return (
                        <div key={cat} className="mb-2">
                          <button onClick={() => toggleCategory(cat)}
                            className="w-full flex items-center justify-between px-2 py-1 text-[11px] uppercase tracking-wider text-slate-400 hover:text-white">
                            <span>{cat}</span>
                            <span className="text-slate-600">{selected}/{catTools.length}</span>
                          </button>
                          <div className="grid grid-cols-2 gap-x-2">
                            {catTools.map(t => (
                              <label key={t.id} className="flex items-center gap-2 px-2 py-1 text-xs text-slate-300 hover:bg-slate-800 rounded cursor-pointer">
                                <input type="checkbox" checked={form.tools.includes(t.id)} onChange={() => toggleTool(t.id)} />
                                <t.icon size={11} className="text-indigo-400" />
                                <span className="truncate">{t.name}</span>
                              </label>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
                <div className="text-[10px] text-slate-500 mt-1">
                  {form.allTools ? `All ${TOOLS.length} tools granted` : `${form.tools.length} of ${TOOLS.length} tools selected`}
                </div>
              </div>
            </div>
            <div className="px-5 py-3 border-t border-slate-800 flex justify-end gap-2">
              <button onClick={() => setShowAdd(false)} className="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">Cancel</button>
              <button onClick={save} className="text-xs px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded flex items-center gap-1">
                <Save size={11} /> {editing ? 'Update' : 'Issue Session'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
